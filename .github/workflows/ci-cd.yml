name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.ACR_NAME }}.azurecr.io/cicd-demo

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 3. Run unit tests
        run: mvn -B test

      - name: 4. Package application
        run: mvn -B package -DskipTests

      - name: 5. Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: 6. Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 7. Build and tag Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: 8. Push image to ACR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: 9. Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: 10. Deploy to AKS with Ansible
        env:
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          pip install ansible
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml

      - name: 11. Verify deployment
        run: |
          kubectl get pods
          for i in $(seq 1 30); do
            IP=$(kubectl get svc cicd-demo -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && break
            sleep 10
          done
          echo "App URL: http://$IP"
          curl -f http://$IP/actuator/health
          curl -s http://$IP/